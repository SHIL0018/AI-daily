services:
  db:
    image: postgres:16-alpine
    container_name: activity-daily-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: activity_daily
      POSTGRES_USER: activitydaily
      POSTGRES_PASSWORD: ${APP_DATABASE_PASSWORD:-change-me-db-password}
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activitydaily -d activity_daily"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    container_name: activity-daily-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      SERVER_PORT: 8080
      APP_DATABASE_URL: jdbc:postgresql://db:5432/activity_daily
      APP_DATABASE_USERNAME: activitydaily
      APP_DATABASE_PASSWORD: ${APP_DATABASE_PASSWORD:-change-me-db-password}
      APP_DATABASE_DRIVER: org.postgresql.Driver
      SPRING_PROFILES_ACTIVE: prod
      APP_REGISTRATION_ENABLED: ${APP_REGISTRATION_ENABLED:-false}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:8080"
